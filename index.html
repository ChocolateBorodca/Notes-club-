<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notes club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">notes club</div>
            <div class="ambient-status">ambient: off</div>
        </div>

        <!-- Режим: Писать / Рекомендации -->
        <div class="row-toggle">
            <div class="btn-toggle active" id="btn-write">писать</div>
            <div class="btn-toggle" id="btn-recommend" style="color: #444444;">рекомендации</div>
        </div>

        <!-- Поле для заметки с микрофоном -->
        <div class="input-container">
            <textarea class="note-textarea" id="note-input" placeholder="Зафиксируй состояние или зажми микрофон..."></textarea>
            <button class="mic-btn" id="mic-button">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
        </div>

        <!-- Приватность: Личное / Публичное -->
        <div class="row-toggle">
            <div class="btn-toggle active" id="btn-private">личное</div>
            <div class="btn-toggle" id="btn-public" style="color: #444444;">публичное</div>
        </div>

        <!-- Основная кнопка -->
        <button class="btn-submit" id="submit-button">отправить</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
